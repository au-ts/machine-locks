[package]
name = "machine-locks-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
env_logger = "0.11.11"
log = "0.4.35"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
serde = "1.0.229"
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
common = { path = "../common" }
