[package]
name = "machine-locks-client"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
common = { path = "../common" }
anyhow = "1.0.104"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
tabled = "0.22.0"
csv = "1.4.0"
chrono = { version = "0.4.45", features = ["serde"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
openidconnect = { version = "4.1.0", features = ["reqwest-blocking"] }
keyring = "4.2.0"
